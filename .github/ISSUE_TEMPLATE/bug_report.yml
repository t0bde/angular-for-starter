name: Bug report
description: Report something that isn't working
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ng serve`
        2. Open /home
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Angular / Node version
      placeholder: Angular 18.x, Node 20.x
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
