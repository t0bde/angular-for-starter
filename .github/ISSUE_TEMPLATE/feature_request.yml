name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
      description: Describe the observable result that would solve the problem. List testable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or non-goals
      description: Note important limitations or work that should stay out of scope.
