<aside class="control-panel" [attr.aria-label]="t('lifeControls.label')">
  <div class="control-group">
    <div class="command-row">
      <button type="button" class="primary-command" (click)="runToggled.emit()">
        {{ running() ? t('common.pause') : t('lifeControls.germinate') }}
      </button>
      <button type="button" class="icon-command" (click)="stepRequested.emit()">{{ t('lifeControls.step') }}</button>
      <button type="button" class="icon-command" (click)="resetRequested.emit()">{{ t('lifeControls.replant') }}</button>
      <button type="button" class="icon-command" (click)="clearRequested.emit()">{{ t('lifeControls.clear') }}</button>
    </div>
  </div>

  <div class="control-group">
    <p class="group-title">{{ t('lifeControls.growthSpeed') }}</p>
    <div class="segment-control" role="group" [attr.aria-label]="t('common.speed')">
      @for (option of speeds; track option) {
        <button
          type="button"
          [class.selected]="speed() === option"
          (click)="speedSelected.emit(option)"
        >
          {{ t('speed.' + option) }}
        </button>
      }
    </div>
    <label class="wrap-toggle">
      <input type="checkbox" [checked]="wrapEdges()" (change)="wrapToggled.emit()" />
      <span>{{ t('lifeControls.wrap') }}</span>
    </label>
  </div>

  <div class="control-group">
    <p class="group-title">{{ t('lifeControls.seedField') }}</p>
    <div class="preset-list" role="group" [attr.aria-label]="t('lifeControls.seedGroup')">
      @for (preset of presets(); track preset.id) {
        <button
          type="button"
          [class.selected]="activePreset() === preset.id"
          (click)="presetSelected.emit(preset.id)"
        >
          <span class="preset-name">{{ t('seed.' + preset.id + '.label') }}</span>
          <span class="preset-meta">{{ t('lifeControls.cells', { count: preset.cells }) }}</span>
        </button>
      }
    </div>
    <p class="seed-blurb">{{ t('seed.' + activeSeedInfo().id + '.description') }}</p>
  </div>

  <div class="control-group">
    <p class="group-title">{{ t('lifeControls.brush') }}</p>
    <div class="tool-list" role="group" [attr.aria-label]="t('lifeControls.brushGroup')">
      @for (brush of brushes; track brush.id) {
        <button
          type="button"
          [class.selected]="selectedBrush() === brush.id"
          (click)="brushSelected.emit(brush.id)"
        >
          <span class="tool-mark" [class]="brush.id">{{ brush.mark }}</span>
          <span>{{ t('brush.' + brush.id) }}</span>
        </button>
      }
    </div>
  </div>
</aside>
