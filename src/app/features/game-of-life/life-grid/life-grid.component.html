<div class="garden-stage">
  <div class="garden-frame">
    <div
      class="garden-grid"
      role="grid"
      [attr.aria-label]="t('lifeGrid.label')"
      [style.--columns]="grid()[0]?.length || 32"
    >
      @for (row of grid(); track $index; let rowIndex = $index) {
        @for (cell of row; track $index; let columnIndex = $index) {
          <button
            type="button"
            role="gridcell"
            class="garden-cell"
            [id]="'life-cell-' + rowIndex + '-' + columnIndex"
            [class]="cellStageClass(cell)"
            [attr.aria-label]="cellLabel(cell, rowIndex, columnIndex)"
            [attr.aria-pressed]="cell.alive"
            [tabIndex]="cellTabIndex(rowIndex, columnIndex)"
            (click)="paint(rowIndex, columnIndex)"
            (keydown)="moveFocus($event, rowIndex, columnIndex)"
          >
            @if (cell.alive) {
              <span class="cell-node"></span>
            }
          </button>
        }
      }
    </div>
  </div>

  <div class="legend-bar" [attr.aria-label]="t('lifeGrid.legend')">
    <span class="legend-item">
      <i class="swatch sprout"></i> {{ t('lifeGrid.legendSprout') }}
    </span>
    <span class="legend-item">
      <i class="swatch flora"></i> {{ t('lifeGrid.legendFlora') }}
    </span>
    <span class="legend-item">
      <i class="swatch perennial"></i> {{ t('lifeGrid.legendPerennial') }}
    </span>
  </div>
</div>
