<section class="lesson-panel" [attr.aria-label]="t('lifeLesson.label')">
  <div>
    <p class="eyebrow">{{ t('lifeLesson.eyebrow') }}</p>
    <h2>{{ message() }}</h2>
  </div>
  <div class="rules-pills">
    <span class="rule-pill"><strong>{{ t('lifeLesson.birth') }}</strong> {{ t('lifeLesson.birthText') }}</span>
    <span class="rule-pill"><strong>{{ t('lifeLesson.survival') }}</strong> {{ t('lifeLesson.survivalText') }}</span>
    <span class="rule-pill"><strong>{{ t('lifeLesson.decay') }}</strong> {{ t('lifeLesson.decayText') }}</span>
  </div>
</section>
