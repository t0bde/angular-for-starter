<main class="life-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">{{ t('life.eyebrow') }}</p>
      <h1>{{ t('life.heading') }}</h1>
    </div>
    <div class="topbar-badges">
      <span class="seed-badge">{{ t('life.seed', { name: seedName() }) }}</span>
      <div class="step-counter" aria-live="polite">{{ t('life.gen', { generation: world().generation }) }}</div>
    </div>
  </header>

  <app-life-stats [stats]="stats()" />

  <section class="playground" [attr.aria-label]="t('life.simulation')">
    <app-life-controls
      [running]="running()"
      [speed]="speed()"
      [wrapEdges]="world().wrapEdges"
      [presets]="presets"
      [activePreset]="activePreset()"
      [activeSeedInfo]="activeSeedInfo()"
      [selectedBrush]="selectedBrush()"
      (runToggled)="toggleRunning()"
      (stepRequested)="step()"
      (resetRequested)="reset()"
      (clearRequested)="clearField()"
      (speedSelected)="setSpeed($event)"
      (wrapToggled)="toggleWrapEdges()"
      (presetSelected)="selectPreset($event)"
      (brushSelected)="selectBrush($event)"
    />
    <app-life-grid
      [grid]="world().grid"
      [activeCell]="activeCell()"
      (cellPainted)="paintCell($event)"
      (activeCellChanged)="setActiveCell($event)"
    />
  </section>

  <app-life-lesson [message]="colonyMessage()" />
</main>
