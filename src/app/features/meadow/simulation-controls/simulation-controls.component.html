<aside class="control-panel">
  <div class="control-group">
    <h2>{{ t('controls.runHeading') }}</h2>
    <div class="command-row">
      <button class="primary-command" type="button" (click)="runToggled.emit()">
        {{ running() ? t('common.pause') : t('controls.play') }}</button
      ><button
        class="icon-command"
        type="button"
        (click)="stepRequested.emit()"
        [attr.aria-label]="t('controls.advance')"
        [title]="t('controls.advance')"
      >
        {{ t('controls.next') }}</button
      ><button
        class="icon-command"
        type="button"
        (click)="resetRequested.emit()"
        [attr.aria-label]="t('controls.resetMeadow')"
        [title]="t('controls.resetMeadow')"
      >
        {{ t('controls.reset') }}
      </button>
    </div>
  </div>
  <div class="control-group">
    <h2>{{ t('controls.speedHeading') }}</h2>
    <div class="segment-control" role="group" [attr.aria-label]="t('common.speed')">
      @for (option of speeds; track option) {
        <button
          type="button"
          [class.selected]="speed() === option"
          (click)="speedSelected.emit(option)"
        >
          {{ t('speed.' + option) }}
        </button>
      }
    </div>
  </div>
  <div class="control-group">
    <h2>{{ t('controls.storyHeading') }}</h2>
    <div class="preset-list">
      <button type="button" (click)="presetSelected.emit('balanced')">{{ t('controls.balanced') }}</button
      ><button type="button" (click)="presetSelected.emit('meadow')">{{ t('controls.greenMeadow') }}</button
      ><button type="button" (click)="presetSelected.emit('predator-boom')">{{ t('controls.predatorBoom') }}</button>
    </div>
  </div>
  <div class="control-group">
    <h2>{{ t('controls.paintHeading') }}</h2>
    <div class="tool-list">
      @for (tool of tools; track tool.id) {
        <button
          type="button"
          [class.selected]="selectedTool() === tool.id"
          (click)="toolSelected.emit(tool.id)"
        >
          <span class="tool-mark" [class]="tool.id">
            @if (toolImage(tool); as image) {
              <img [src]="image" alt="" />
            } @else {
              {{ tool.mark }}
            }</span
          >{{ t('species.' + tool.id) }}
        </button>
      }
    </div>
  </div>
</aside>
