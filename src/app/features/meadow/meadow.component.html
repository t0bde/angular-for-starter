<main class="meadow-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">{{ t('meadow.eyebrow') }}</p>
      <h1>{{ t('meadow.heading') }}</h1>
    </div>
    <div class="step-counter" aria-live="polite">{{ t('meadow.day', { day: world().tick }) }}</div>
  </header>
  <app-population-summary [populations]="populations()" />
  <section class="playground" [attr.aria-label]="t('meadow.simulation')">
    <app-simulation-controls
      [running]="running()"
      [speed]="speed()"
      [selectedTool]="selectedTool()"
      (runToggled)="toggleRunning()"
      (stepRequested)="step()"
      (resetRequested)="reset()"
      (presetSelected)="applyPreset($event)"
      (speedSelected)="setSpeed($event)"
      (toolSelected)="selectTool($event)"
    />
    <app-meadow-grid
      [grid]="world().grid"
      [activeCell]="activeCell()"
      (cellPainted)="paint($event)"
      (activeCellChanged)="setActiveCell($event)"
    />
  </section>
  <section class="behavior-panel" [attr.aria-label]="t('meadow.behaviorLabel')">
    <h2>{{ t('meadow.behaviorHeading') }}</h2>
    <div class="behavior-list">
      <label class="behavior-row"
        ><span class="behavior-label"
          ><img class="behavior-icon" src="species/plant.svg" alt="" />{{ t('meadow.plantGrowth') }}<strong>{{
            asPercent(behaviorSettings().plantGrowthChance)
          }}</strong></span
        ><input
          type="range"
          min="0"
          max="0.4"
          step="0.02"
          [value]="behaviorSettings().plantGrowthChance"
          (input)="changeBehavior('plantGrowthChance', $any($event.target).value)"
      /></label>
      <label class="behavior-row"
        ><span class="behavior-label"
          ><img class="behavior-icon" src="species/herbivore.svg" alt="" />{{ t('meadow.herbivoreReproduction') }}<strong>{{
            asPercent(behaviorSettings().herbivoreReproductionChance)
          }}</strong></span
        ><input
          type="range"
          min="0"
          max="0.5"
          step="0.02"
          [value]="behaviorSettings().herbivoreReproductionChance"
          (input)="changeBehavior('herbivoreReproductionChance', $any($event.target).value)"
      /></label>
      <label class="behavior-row"
        ><span class="behavior-label"
          ><img class="behavior-icon" src="species/herbivore.svg" alt="" />{{ t('meadow.herbivoreAggression') }}<strong>+{{ behaviorSettings().herbivoreFoodEnergy }}</strong></span
        ><input
          type="range"
          min="1"
          max="10"
          step="1"
          [value]="behaviorSettings().herbivoreFoodEnergy"
          (input)="changeBehavior('herbivoreFoodEnergy', $any($event.target).value)"
      /></label>
      <label class="behavior-row"
        ><span class="behavior-label"
          ><img class="behavior-icon" src="species/predator.svg" alt="" />{{ t('meadow.predatorReproduction') }}<strong>{{
            asPercent(behaviorSettings().predatorReproductionChance)
          }}</strong></span
        ><input
          type="range"
          min="0"
          max="0.5"
          step="0.02"
          [value]="behaviorSettings().predatorReproductionChance"
          (input)="changeBehavior('predatorReproductionChance', $any($event.target).value)"
      /></label>
      <label class="behavior-row"
        ><span class="behavior-label"
          ><img class="behavior-icon" src="species/predator.svg" alt="" />{{ t('meadow.predatorAggression') }}<strong
            >+{{ behaviorSettings().predatorFoodEnergy }}</strong
          ></span
        ><input
          type="range"
          min="1"
          max="10"
          step="1"
          [value]="behaviorSettings().predatorFoodEnergy"
          (input)="changeBehavior('predatorFoodEnergy', $any($event.target).value)"
      /></label>
    </div>
  </section>
  <app-meadow-lesson [message]="ecosystemMessage()" />
</main>
