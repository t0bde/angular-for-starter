<div class="meadow-frame"><div class="meadow-grid" [style.--columns]="grid()[0].length">@for (row of grid(); track $index; let rowIndex = $index) { @for (cell of row; track $index; let columnIndex = $index) { <button class="habitat-cell" [class]="cell.species" [id]="'habitat-cell-' + rowIndex + '-' + columnIndex" type="button" [attr.tabindex]="cellTabIndex(rowIndex, columnIndex)" [attr.aria-label]="cellLabel(cell, rowIndex, columnIndex)" (click)="paint(rowIndex, columnIndex)" (keydown)="moveFocus($event, rowIndex, columnIndex)"><span aria-hidden="true">{{ cellMark(cell) }}</span></button> } }</div></div>
