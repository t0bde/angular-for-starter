<aside class="control-panel">
  <div class="control-group"><h2>Run the meadow</h2><div class="command-row"><button class="primary-command" type="button" (click)="runToggled.emit()">{{ running() ? 'Pause' : 'Play' }}</button><button class="icon-command" type="button" (click)="stepRequested.emit()" aria-label="Advance one day" title="Advance one day">Next</button><button class="icon-command" type="button" (click)="resetRequested.emit()" aria-label="Reset balanced meadow" title="Reset balanced meadow">Reset</button></div></div>
  <div class="control-group"><h2>Speed</h2><div class="segment-control" role="group" aria-label="Simulation speed">@for (option of speeds; track option) { <button type="button" [class.selected]="speed() === option" (click)="speedSelected.emit(option)">{{ option }}</button> }</div></div>
  <div class="control-group"><h2>Start a story</h2><div class="preset-list"><button type="button" (click)="presetSelected.emit('balanced')">Balanced</button><button type="button" (click)="presetSelected.emit('meadow')">Green meadow</button><button type="button" (click)="presetSelected.emit('predator-boom')">Predator boom</button></div></div>
  <div class="control-group"><h2>Paint the meadow</h2><div class="tool-list">@for (tool of tools; track tool.id) { <button type="button" [class.selected]="selectedTool() === tool.id" (click)="toolSelected.emit(tool.id)"><span class="tool-mark" [class]="tool.id">@if (toolImage(tool); as image) { <img [src]="image" alt=""> } @else { {{ tool.mark }} }</span>{{ tool.label }}</button> }</div></div>
</aside>
