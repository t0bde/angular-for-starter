<nav class="lab-navbar" [attr.aria-label]="t('app.navLabel')">
  <div class="lab-navbar-inner">
    <span class="lab-brand">{{ t('app.title') }}</span>
    <div class="lab-links">
      <a
        routerLink="/meadow"
        routerLinkActive="active-link"
        class="lab-link"
      >
        {{ t('nav.meadow') }}
      </a>
      <a
        routerLink="/game-of-life"
        routerLinkActive="active-link"
        class="lab-link"
      >
        {{ t('nav.life') }}
      </a>
      <a
        routerLink="/how-it-works"
        routerLinkActive="active-link"
        class="lab-link"
      >
        {{ t('nav.howItWorks') }}
      </a>
    </div>
    <div class="lang-switch" role="group" [attr.aria-label]="t('app.language')">
      @for (option of languages; track option) {
        <button
          type="button"
          [lang]="option"
          [attr.aria-pressed]="i18n.lang() === option"
          (click)="i18n.setLang(option)"
        >
          {{ option.toUpperCase() }}
        </button>
      }
    </div>
  </div>
</nav>
<router-outlet />
<footer class="lab-footer">
  <a routerLink="/impressum" class="footer-link">{{ t('app.footerLegal') }}</a>
</footer>
